[package]
name = "terrain-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
cgmath = "0.18.0"
env_logger = "0.10"
log = "0.4"
pollster = "0.3"
wgpu = "28.0"
winit = { version = "0.30", features = ["android-native-activity"] }

[dependencies.image]
version = "0.24"
default-features = false
features = ["jpeg", "png"]

[profile.release]
strip = true
