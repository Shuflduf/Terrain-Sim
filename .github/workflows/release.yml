name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check version and release status
        id: check
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version = "\([^"]*\)"/\1/p')
          echo "version=$version" >> $GITHUB_OUTPUT
          
          latest_release=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | \
            grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/' || echo "none")
          
          if [ "$latest_release" != "$version" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-arm64
          # Linux ARM 32-bit
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            asset_suffix: linux-armv7
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64.exe
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_suffix: windows-arm64.exe
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: startsWith(matrix.os, 'ubuntu') && (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'armv7'))
        run: cargo install cross

      - name: Build release binary
        if: startsWith(matrix.os, 'ubuntu') && (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'armv7'))
        run: cross build --release --target ${{ matrix.target }} --bin terrain-sim

      - name: Build release binary
        if: ${{ !( startsWith(matrix.os, 'ubuntu') && (startsWith(matrix.target, 'aarch64') || startsWith(matrix.target, 'armv7')) ) }}
        run: cargo build --release --target ${{ matrix.target }} --bin terrain-sim

      - name: Prepare asset
        shell: bash
        run: |
          binary_name=$(sed -n 's/^name = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ${binary_name}.exe ../../${binary_name}-${{ matrix.asset_suffix }}
          else
            cp ${binary_name} ../../${binary_name}-${{ matrix.asset_suffix }}
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*-${{ matrix.asset_suffix }}
          tag_name: v${{ needs.check-version.outputs.version }}
          body: |
            Release v${{ needs.check-version.outputs.version }}
            Commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Publish to crates.io
        run: |
          cargo login ${{ secrets.CRATES_IO }}
          cargo publish --allow-dirty
          rm -f ~/.cargo/credentials

  deploy-wasm-pages:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build --target web

      - name: Remove pkg .gitignore
        run: rm -f pkg/.gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
